name: Executáveis

# Ao publicar uma tag v* (git tag v1.0 && git push --tags), o AppImage e o .exe vão para a página
# de Releases. Em Actions > Executáveis > Run workflow, saem só como artefato do próprio run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# O token só lê o repositório; o job que publica o release pede escrita para ele
permissions:
  contents: read

jobs:
  empacotar:
    strategy:
      fail-fast: false
      matrix:
        # 22.04 e não latest: o AppImage roda em sistemas com glibc igual ou mais nova que a de quem o gerou
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-build.txt
      - name: Guardar o modelo de remover fundo entre execuções
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\euamopdf' || '~/.cache/euamopdf' }}  # app.bg_model_path()
          key: modelo-isnet-60920e99c454
      - run: python packaging/build.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: EuAmoPDF-${{ runner.os }}
          path: dist/EuAmoPDF*
          compression-level: 0  # já vêm comprimidos

  publicar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: empacotar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Somas de verificação, para quem baixa conferir o arquivo
        run: cd dist && sha256sum EuAmoPDF* > SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
