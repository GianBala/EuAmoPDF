name: Auditoria

# Vulnerabilidades conhecidas nas dependências. Roda também toda semana: uma falha publicada depois do
# último push aparece sem esperar o próximo, e é a hora de gerar um release novo dos executáveis,
# que congelam as bibliotecas do dia em que foram gerados.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r requirements.txt
